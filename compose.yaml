services:
  postgres:
    image: postgres@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_DB: ai_ops
      POSTGRES_USER: ai_ops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-not-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_ops -d ai_ops"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [backend]

  redis:
    image: redis@sha256:bb142a9c18ac18a16713c1491d779697b4e107c22a97266616099d288237ef47
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [backend]

  minio:
    image: minio/minio@sha256:9535594ad4122b7a78c6632788a989b96d9199b483d3bd71a5ceae73a922cdfa
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio-local-user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-local-password}
    command: ["server", "/data"]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [backend]

  healthcheck:
    image: python:3.12-slim
    working_dir: /app
    environment:
      APP_ENV: local
      APP_MODE: offline
      SQLITE_PATH: /app/.runtime/app.sqlite3
    volumes:
      - .:/app:ro
      - app_runtime:/app/.runtime
    command: ["python", "-c", "import json; json.load(open('/app/scripts/healthcheck-fixture.json')); print('HEALTHCHECK_PASS mode=offline database=sqlite adapter=mock')"]
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  app_runtime:
  postgres_data:
  redis_data:
  minio_data:
