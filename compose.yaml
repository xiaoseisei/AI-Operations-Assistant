services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: ai_ops
      POSTGRES_USER: ai_ops
      POSTGRES_PASSWORD: local-only-not-secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_ops -d ai_ops"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.4.1
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    environment:
      MINIO_ROOT_USER: minio-local-user
      MINIO_ROOT_PASSWORD: minio-local-password
    command: ["server", "/data"]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  healthcheck:
    image: python:3.12-slim
    working_dir: /app
    environment:
      APP_ENV: local
      APP_MODE: offline
      SQLITE_PATH: /app/.runtime/app.sqlite3
    volumes:
      - .:/app:ro
      - app_runtime:/app/.runtime
    command: ["python", "-c", "import json; json.load(open('/app/scripts/healthcheck-fixture.json')); print('HEALTHCHECK_PASS mode=offline database=sqlite adapter=mock')"]

volumes:
  app_runtime:
  postgres_data:
  redis_data:
  minio_data:
